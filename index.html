<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>WansTeknik App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand-wrap">
    <img src="logo-wt.png" class="brand-icon" alt="Logo WT">
    <img src="logo-brand.png" class="brand-image" alt="WansTeknik - Service & Repair">
  </div>
</header>

<main class="container">
  <section class="hero">
    <p class="eyebrow">WANSTEKNIK BUSINESS SYSTEM</p>
    <h1>Service & Repair</h1>
    <p>Dashboard operasional WansTeknik untuk mengatur pekerjaan, jadwal, pemasukan, pengajuan, dan arsip.</p>
  </section>

  <section class="menu-grid">
    <button class="menu-card" onclick="openHome()"><span>🏠</span><b>Home</b><small>Website utama WansTeknik</small></button>
    <button class="menu-card" onclick="openJadwal()"><span>📅</span><b>Jadwal & Alarm</b><small>Atur pekerjaan dan pengingat</small></button>
    <button class="menu-card" onclick="openPemasukan()"><span>💰</span><b>Pemasukan</b><small>Input dan catatan pemasukan</small></button>
    <button class="menu-card" onclick="openPengajuan()"><span>📝</span><b>Pengajuan</b><small>Akses khusus admin</small></button>
    <button class="menu-card" onclick="openGaleri()"><span>🗂️</span><b>Galeri & Arsip</b><small>Dokumen, foto dan sejarah</small></button>
  </section>

  <section id="content" class="content">
    <h2>Selamat datang 👋</h2>
    <p>Pilih menu untuk mulai mengelola WansTeknik.</p>
    <div class="status">V2.1 Dashboard aktif</div>
  </section>
</main>

<footer>© 2026 WansTeknik • Service & Repair</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="apps.js"></script>
</body>
</html>
